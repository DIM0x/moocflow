name: mooc deadline reminder

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC；以下分别是北京时间 07:54 / 17:54（错开整点，避开高负载丢单）
    - cron: '54 23 * * *'
    - cron: '54 9 * * *'
  workflow_dispatch: {}

# github 渠道需要 issues: write 来向提醒 issue 追加评论
permissions:
  contents: read
  issues: write

concurrency:
  group: mooc-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 两个 step 共用；留空时由 src/config.mjs 提供默认值
      REMINDERS_FILE: ${{ vars.REMINDERS_FILE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 步骤一：检测。拉取课程、解析截止时间，把待提醒事件写入约定文件
      - name: Detect due items
        env:
          # Secret：完整浏览器 Cookie 串（含 NTESSTUDYSI、STUDY_SESS、STUDY_PERSIST 及身份 Cookie）
          MOOC_COOKIE: ${{ secrets.MOOC_COOKIE }}
          # 0=不刷新；1=刷新但只本次使用（默认）；2=刷新并用 PAT 写回 Secret
          COOKIE_REFRESH_MODE: ${{ vars.COOKIE_REFRESH_MODE }}
          # 模式 2 可覆盖的 Secret 名
          MOOC_COOKIE_SECRET_NAME: ${{ vars.MOOC_COOKIE_SECRET_NAME }}
          # 模式 2 必填：Fine-grained PAT（目标仓库 Secrets 读写权限）
          MOOC_REFRESH_PAT: ${{ secrets.MOOC_REFRESH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 课程列表（仓库 Variable，必填）：多门课程用分号或换行分隔
          MOOC_COURSES: ${{ vars.MOOC_COURSES }}
          # 仓库 Variables；留空时由 src/config.mjs 提供默认值
          DUE_WINDOW_HOURS: ${{ vars.DUE_WINDOW_HOURS }}
          OVERDUE_DAYS: ${{ vars.OVERDUE_DAYS }}
        run: node scripts/check.mjs

      # 步骤二：发送。只读取上面的提醒文档，与检测逻辑解耦。
      # NOTIFY_CHANNEL=github（默认，见 src/config.mjs）：向手动创建的提醒 issue 追加评论，借 GitHub 通知邮件送达；
      # NOTIFY_CHANNEL=mail：改走 SMTP 邮件。切换只需设置仓库 Variable NOTIFY_CHANNEL。
      - name: Send notification
        env:
          # 仓库 Variable；留空时由 src/config.mjs 回退到默认渠道
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL }}
          # github 渠道所需
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REMINDER_ISSUE_NUMBER: ${{ vars.REMINDER_ISSUE_NUMBER }}
          # 旧 bot 评论保留天数；留空时由 src/config.mjs 回退到默认值 7
          COMMENT_RETENTION_DAYS: ${{ vars.COMMENT_RETENTION_DAYS }}
          # mail 渠道所需
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # 仓库 Variable；留空时按端口推断
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: node scripts/notify.mjs
