name: mooc deadline reminder

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC；以下设计时间原为北京时间 07:54 / 17:54；根据GitHub运行情况做如下提前
    # - cron: '54 23 * * *'
    # - cron: '54 9 * * *'
    - cron: '54 3 * * *'
    - cron: '24 17 * * *'
  workflow_dispatch: {}

# github 渠道需要 issues: write 来向提醒 issue 追加评论
permissions:
  contents: read
  issues: write

concurrency:
  group: mooc-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 两个 step 共用；留空时由 src/config.mjs 提供默认值
      REMINDERS_FILE: ${{ vars.REMINDERS_FILE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 模式 3：用 GitHub App 安装令牌写回 Secret；其他模式跳过（outputs.token 为空）
      - id: app-token
        if: vars.COOKIE_REFRESH_MODE == '3'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MOOC_APP_ID }}
          private-key: ${{ secrets.MOOC_APP_PRIVATE_KEY }}
          permission-secrets: write

      # 步骤一：检测。拉取课程、解析截止时间，把待提醒事件写入约定文件
      - name: Detect due items
        env:
          # Secret：完整浏览器 Cookie 串（含 NTESSTUDYSI、STUDY_SESS、STUDY_PERSIST 及身份 Cookie）
          MOOC_COOKIE: ${{ secrets.MOOC_COOKIE }}
          # 0=不刷新；1=刷新但只本次使用（默认）；2=刷新并用 PAT 写回 Secret；3=用 GitHub App 写回
          COOKIE_REFRESH_MODE: ${{ vars.COOKIE_REFRESH_MODE }}
          # 模式 2/3 可覆盖的 Secret 名
          MOOC_COOKIE_SECRET_NAME: ${{ vars.MOOC_COOKIE_SECRET_NAME }}
          # 模式 2 必填：Fine-grained PAT（目标仓库 Secrets 读写权限）
          MOOC_REFRESH_PAT: ${{ secrets.MOOC_REFRESH_PAT }}
          # 模式 3：上一步生成的 GitHub App 安装令牌（1 小时后过期，任务结束即吊销）
          MOOC_REFRESH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 课程列表（仓库 Variable，必填）：多门课程用分号或换行分隔
          MOOC_COURSES: ${{ vars.MOOC_COURSES }}
          # 仓库 Variables；留空时由 src/config.mjs 提供默认值
          DUE_WINDOW_HOURS: ${{ vars.DUE_WINDOW_HOURS }}
          OVERDUE_DAYS: ${{ vars.OVERDUE_DAYS }}
        run: node scripts/check.mjs

      # 步骤二：发送。只读取上面的提醒文档，与检测逻辑解耦。
      # NOTIFY_CHANNEL=github（默认，见 src/config.mjs）：向手动创建的提醒 issue 追加评论，借 GitHub 通知邮件送达；
      # NOTIFY_CHANNEL=mail：改走 SMTP 邮件；
      # NOTIFY_CHANNEL=wechat / qq：推送到微信 / QQ（聚合渠道，按 WECHAT_CHANNELS / QQ_CHANNELS
      # 的顺序在子渠道间 fallback）。切换只需设置仓库 Variable NOTIFY_CHANNEL。
      - name: Send notification
        env:
          # 仓库 Variable；留空时由 src/config.mjs 回退到默认渠道
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL }}
          # github 渠道所需
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REMINDER_ISSUE_NUMBER: ${{ vars.REMINDER_ISSUE_NUMBER }}
          # 旧 bot 评论保留天数；留空时由 src/config.mjs 回退到默认值 7
          COMMENT_RETENTION_DAYS: ${{ vars.COMMENT_RETENTION_DAYS }}
          # mail 渠道所需
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # 仓库 Variable；留空时按端口推断
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          # wechat / qq 渠道所需（顺序变量非敏感放 Variable，key 类放 Secret）
          WECHAT_CHANNELS: ${{ vars.WECHAT_CHANNELS }}
          QQ_CHANNELS: ${{ vars.QQ_CHANNELS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          QMSG_GROUP: ${{ secrets.QMSG_GROUP }}
          QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_BOT_SECRET: ${{ secrets.QQ_BOT_SECRET }}
          QQ_BOT_GROUP_OPENID: ${{ secrets.QQ_BOT_GROUP_OPENID }}
        run: node scripts/notify.mjs
